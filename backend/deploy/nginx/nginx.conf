worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 150M request ceiling gives headroom above the 100 MB app-level backup
    # cap (BackupService::HTTP_MAX_KB) for multipart overhead. Files above the
    # Cloudflare edge limit (~100 MB) must be restored on the server itself
    # via `php artisan backup:restore` instead of the browser upload.
    client_max_body_size 150M;

    # Logging
    access_log "C:/nginx/logs/access.log";
    error_log  "C:/nginx/logs/error.log" warn;

    # Gzip compression for high-speed client delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Map X-Forwarded-Proto from Cloudflare/proxies to FastCGI HTTPS
    map $http_x_forwarded_proto $fastcgi_https {
        default $https;
        https   on;
    }

    # Multi-process PHP FastCGI pool for concurrent handling on Windows
    upstream php_pool {
        server 127.0.0.1:9000 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9001 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9002 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9003 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9004 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9005 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9006 max_fails=3 fail_timeout=3s;
        server 127.0.0.1:9007 max_fails=3 fail_timeout=3s;
    }

    server {
        listen       8000;
        listen       [::]:8000;
        # NOTE: when a Cloudflare Tunnel fronts this origin, add the public
        # hostname here (e.g. osca.example.gov.ph) and set APP_URL + CORS /
        # Sanctum domains in backend/.env to match. TLS is terminated by
        # Cloudflare; intentional: no HSTS here (origin serves plain HTTP).
        server_name  localhost osca.local 127.0.0.1;

        root "C:/Users/Rolan Sotomayor/Desktop/PROJECTS/OSCA/backend/public";
        index index.php index.html;

        # Relative Location headers instead of scheme://host:port absolutes.
        # Behind a Cloudflare Tunnel the origin sees plain http://127.0.0.1:8000,
        # so an absolute redirect would leak ":8000" (and http) into the browser
        # location. Relative /app/ resolves against whatever origin the user
        # actually used - https://tunnel-host or http://LAN-IP:8000 - both correct.
        absolute_redirect off;

        # Baseline security headers (CSP arrives via Cloudflare Transform Rules
        # or meta tags; clickjacking/MIME-sniffing are enforced at origin).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # Cloudflare Real-IP extraction
        set_real_ip_from 127.0.0.1;
        real_ip_header CF-Connecting-IP;

        # Static assets cache optimization
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # React SPA frontend at /app — Never cache HTML entry point so updates load instantly
        location = /app/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires -1;
        }

        location /app {
            try_files $uri $uri/ /app/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires -1;
        }

        # Vite emits hashed files under /app/assets/ — safe to cache hard.
        # (Nested location drops the parent's no-store headers.)
        location ^~ /app/assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Root redirect to SPA. rewrite (unlike `return 301`) honors
        # absolute_redirect off above -> emits relative Location: /app/,
        # correct behind both the LAN origin and a Cloudflare Tunnel.
        location = / {
            rewrite ^ /app/ permanent;
        }

        # Main route handling — all requests fall through to Laravel index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Pass PHP scripts to FastCGI pool
        # (HTTP_HOST is supplied by our fastcgi_params file — required for
        # Laravel signed-URL validation; see the note there.)
        location ~ \.php$ {
            fastcgi_pass   php_pool;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Block access to hidden files (.env, .git, etc.) except .well-known
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Citizen ID photos live under storage/app/public/profile_photos and are
        # served ONLY through signed /api/storage/profiles URLs (controllers
        # enforce signature-or-session). The public storage symlink path must
        # never serve them directly — 404 instead of 403 to avoid confirming
        # file existence to scanners.
        location ^~ /storage/ {
            return 404;
            access_log off;
            log_not_found off;
        }
    }
}
